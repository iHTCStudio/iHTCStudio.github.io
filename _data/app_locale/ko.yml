  blurbs: '오프라인 맹자 스튜디오: 690장, 3549절, 비유와 대화 지도 수록. 낭송, 호연지기 공부, 의(義) 찾기, 오늘의 말씀, 위젯과 Siri 지원 — 계정 불필요, 광고 없음.'
  highlights:
  - 690장
  - 비유
  - 호연지기 공부
  - 오늘의 말씀
iMoZi:
  taglines: 묵자 — 네 가지 긴 가이드, 현대어 층, 접이식 소개.
  blurbs: '오프라인 묵자: 십론 지도, 묵가의 긴 가이드 네 편, 현대어 층, 접이식 소개 카드. 낭송, 묵학 공부, 찾기, 오늘의 묵자, 위젯과 Siri 지원 — 계정 불필요, 광고 없음.'
  highlights:
  - 묵자 서재
  - 긴 가이드 네 편
  - 현대어 층
  - 오늘의 묵자
iXunZi:
  taglines: 순자 — 개념·성어 사전, 대역 읽기, 학습.
  blurbs: '오프라인 순자 스튜디오: 개념 사전과 성어 사전이 대역 읽기와 함께 공부를 깊게 해 줍니다. 낭송, 학원 공부, 찾기, 오늘의 순자, 위젯과 Siri 지원 — 계정 불필요, 광고 없음.'
  highlights:
  - 순자 서재
  - 개념 사전
  - 성어 사전
  - 오늘의 순자
iBrowser:
  taglines: 진정한 전체 화면 브라우저 — 위젯, 단축어, 자녀 잠금.
  blurbs: 'iPhone·iPad에서 몰입형 브라우징: 플로트 볼, 홈/잠금 화면 위젯, Siri와 단축어, 북마크용 선택적 iCloud. 자녀 잠금으로 페이지를 고정합니다. 광고 없음, 팝업 없음.'
  highlights:
  - 위젯과 단축어
  - 플로트 볼
  - 자녀 잠금
  - 선택적 iCloud
iMusic:
  taglines: 엄선된 감상 스튜디오 — 오늘의 한 곡, 몰입형 재생, 곡 인식.
  blurbs: '5,300+개의 오리지널 감상 노트를 오프라인으로: 오늘의 한 곡, 몰입형 플레이어(커버 플로우 및 배경 스타일), 곡 인식. 아티스트 페이지에서 Apple Music 카탈로그, 위젯과 Siri 지원.
    계정 불필요, 광고 없음.'
  highlights:
  - 5300+ 가이드
  - 커버 플로우 플레이어
  - 곡 인식
  - 오늘의 한 곡
iBianQue:
  taglines: 난경 문진 — 사진, 도보, 문화 공부.
  blurbs: '오프라인 편작 공방: 『사기』 열전, 81난, 사진 장면, 2D 경락 도보. 오늘의 의술, 작 공부, 위젯과 Siri 지원 — 문화 학습용이며 의학적 조언이 아닙니다.'
  highlights:
  - 81난
  - 사진(四診)
  - 경락 도보
  - 오늘의 의술
iGuige:
  taglines: 귀곡자 공방 — 술 카드, 사례, 상대에 맞게 말하기.
  blurbs: '오프라인 귀곡자 공방: 오용 경고가 담긴 술 카드 40장, 전국시대 사례 200건, 상대에 맞게 말하기. 오늘의 책략, 학원, 위젯과 Siri 지원 — 공부를 위한 앱이며 영업 도구가 아닙니다.'
  highlights:
  - 술 카드 40장
  - 사례 200건
  - 상대에 맞게 말하기
  - 오늘의 책략
iLiezi:
  taglines: 135개 단위로 읽는 열자 — 우화, 허·풍·명, 오늘의 열자.
  blurbs: '『열자』 전체를 오프라인으로: 135개 이야기 단위, 우공·바람 타기·제나라 사람, 그리고 허·풍·명 그래프. 오늘의 열자, 열자 공부, 위젯과 Siri 지원 — 명언 모음이 아닌 하나의 텍스트입니다.'
  highlights:
  - 135개 이야기 단위
  - 우화관
  - 허·풍·명
  - 오늘의 열자
iShangYang:
  taglines: 역사로 읽는 상군서 — 4층, 법령, 연표.
  blurbs: '오프라인 『상군서』: 4층 읽기, 개혁 법령 60조, 기원전 361~338년 연표. 오늘의 변법, 변법 공부, 위젯과 Siri 지원 — 역사 학습용이며 통치 처방이 아닙니다.'
  highlights:
  - 4층 읽기
  - 법령 60조
  - 개혁 연표
  - 오늘의 변법
iZengZi:
  taglines: 증자 계보 — 삼성, 팔조목, 닫힌 구성.
  blurbs: '오프라인으로 읽는 닫힌 증자 세트: 『논어』 발췌, 『대학』, 『효경』, 세 가지 질문 저널. 오늘의 성찰, 수양당, 위젯과 Siri 지원 — 『논어』나 『맹자』 전문이 아닙니다.'
  highlights:
  - 닫힌 증자 세트
  - 세 질문 저널
  - 팔조목
  - 오늘의 성찰
iZiSi:
  taglines: 자사와 중용 — 다섯 단계, 신독, 곽점 죽간.
  blurbs: '오프라인 자사 공방: 주희의 『중용장구』 33장, 곽점 죽간의 오행, 신독 스튜디오. 오늘의 사색, 자사 공부, 위젯과 Siri 지원 — 사서 묶음이 아닙니다.'
  highlights:
  - 『중용』 33장
  - 오행
  - 신독
  - 다섯 단계
iWidget:
  taglines: 위젯 디자이너 — 프리셋 54종, 배경화면 색조, 탭 방지, 오프라인 달력.
  blurbs: '블록으로 홈·잠금 화면·제어 센터 보드를 만드세요: 음력, 날씨, 디데이, 기기 정보. 슬롯별 배경화면, 투명 위젯, Siri와 `iwidget://` 지원 — iCloud는 선택, 계정 불필요.'
  highlights:
  - 프리셋 54종
  - 블록 편집기
  - 탭 방지
  - 홈 + 잠금 위젯
