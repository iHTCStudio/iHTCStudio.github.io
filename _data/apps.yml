    en: Build home, Lock Screen & Control Center boards from blocks — lunar, weather, countdowns & device stats; per-slot
      wallpapers, transparent widgets, Siri & `iwidget://` — optional iCloud, no account.
    zh-CN: 用积木拼主屏/锁屏/控制中心看板——农历、天气、倒数与设备信息；按槽位壁纸、透明小组件、Siri 与 `iwidget://`；可选 iCloud，无需账号。
    zh-TW: 用積木拼主畫面/鎖定/控制中心看板——農曆、天氣、倒數與裝置資訊；依槽位桌布、透明小工具、Siri 與 `iwidget://`；可選 iCloud，無需帳號。
    de: 'Baue Boards für Home-, Sperrbildschirm und Kontrollzentrum aus Blöcken: Mondkalender, Wetter, Countdowns & Gerätedaten.
      Hintergründe pro Slot, transparente Widgets, Siri & `iwidget://` — iCloud optional, ohne Konto.'
    fr: 'Créez des tableaux pour l''écran d''accueil, l''écran verrouillé et le Centre de contrôle à partir de blocs : calendrier
      lunaire, météo, comptes à rebours et infos de l''appareil. Fonds d''écran par emplacement, widgets transparents, Siri
      et `iwidget://` — iCloud optionnel, sans compte.'
    ja: ブロックからホーム・ロック画面・コントロールセンター用のボードを作成：旧暦、天気、カウントダウン、デバイス情報。スロットごとの壁紙、透明ウィジェット、Siriと `iwidget://` 対応 — iCloudは任意、アカウント不要。
    ko: '블록으로 홈·잠금 화면·제어 센터 보드를 만드세요: 음력, 날씨, 디데이, 기기 정보. 슬롯별 배경화면, 투명 위젯, Siri와 `iwidget://` 지원 — iCloud는 선택, 계정 불필요.'
    ru: 'Собирайте панели для экрана «Домой», экрана блокировки и Пункта управления из блоков: лунный календарь, погода, обратный
      отсчёт и данные устройства. Свои обои для каждого слота, прозрачные виджеты, Siri и `iwidget://` — iCloud по желанию,
      без аккаунта.'
    th: 'สร้างบอร์ดสำหรับหน้าจอโฮม หน้าจอล็อก และศูนย์ควบคุมจากบล็อก: ปฏิทินจันทรคติ สภาพอากาศ นับถอยหลัง และข้อมูลอุปกรณ์
      วอลเปเปอร์แยกตามช่อง วิดเจ็ตโปร่งใส Siri และ `iwidget://` — iCloud เป็นตัวเลือก ไม่ต้องมีบัญชี'
    tr: 'Bloklardan Ana ekran, Kilit ekranı ve Denetim Merkezi panoları oluşturun: ay takvimi, hava durumu, geri sayımlar
      ve cihaz bilgileri. Yuva başına duvar kâğıtları, şeffaf widget''lar, Siri ve `iwidget://` — iCloud isteğe bağlı, hesap
      yok.'
