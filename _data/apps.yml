  blurbs:
    en: 'Offline Zisi workshop: Zhu Xi’s 33 Zhongyong chapters, Guodian Five Conducts and Watchfulness studio; Today’s Thought,
      Zisi Study, widgets & Siri — not the Four Books bundle.'
    zh-CN: 子思一线离线研读工坊：朱熹《中庸》三十三章、郭店五行对读与慎独工坊；今日一思、子思学堂与小组件——不是四书全集。
    zh-TW: 子思一線離線研讀工坊：朱熹《中庸》三十三章、郭店五行對讀與慎獨工坊；今日一思、子思學堂與小工具——不是四書全集。
    de: 'Offline-Zisi-Werkstatt: Zhu Xis 33 Zhongyong-Kapitel, die Fünf Verhaltensweisen von Guodian und ein Studio zur Wachsamkeit.
      Gedanke des Tages, Zisi-Studium, Widgets & Siri — nicht das Paket der Vier Bücher.'
    fr: 'Atelier Zisi hors ligne : les 33 chapitres du Zhongyong selon Zhu Xi, les Cinq Conduites de Guodian et un studio
      de la vigilance. Pensée du jour, étude de Zisi, widgets et Siri — pas le lot des Quatre Livres.'
    ja: オフラインの子思工房：朱熹『中庸章句』の33章、郭店楚簡の五行、慎独のアトリエ。今日の思索、子思学習、ウィジェットとSiri対応 — 四書セットではありません。
    ko: '오프라인 자사 공방: 주희의 『중용장구』 33장, 곽점 죽간의 오행, 신독 스튜디오. 오늘의 사색, 자사 공부, 위젯과 Siri 지원 — 사서 묶음이 아닙니다.'
    ru: 'Офлайн-мастерская Цзы Сы: 33 главы «Чжунъюн» по Чжу Си, «Пять поступков» из Годянь и студия бдительности в одиночестве.
      «Мысль дня», изучение Цзы Сы, виджеты и Siri — это не набор «Четверокнижия».'
    th: 'เวิร์กช็อปจื่อซือแบบออฟไลน์: 33 บทจงยงฉบับจูซี ห้าพฤติปฏิบัติจากแผ่นไม้ไผ่กัวเตี้ยน และสตูดิโอการระวังตนยามอยู่ลำพัง
      ความคิดวันนี้ ศึกษาจื่อซือ วิดเจ็ตและ Siri — ไม่ใช่ชุดคัมภีร์สี่เล่ม'
    tr: 'Çevrimdışı Zisi atölyesi: Zhu Xi''nin 33 Zhongyong bölümü, Guodian''ın Beş Davranışı ve Uyanıklık atölyesi. Günün
      Düşüncesi, Zisi Çalışması, widget''lar ve Siri — Dört Kitap paketi değildir.'
