  blurbs:
    en: Chat, group chat, PTT, voice and files over local Wi-Fi between Apple devices. Reply, recall, @mentions and search;
      configurable file size limits. No cloud, no account, no internet required.
    zh-CN: 通过本地 Wi-Fi 在 Apple 设备间直接聊天、群聊、对讲、语音与传文件。支持回复、撤回、@提及与搜索；可配置文件大小上限。无云端、无账号、无需联网。
    zh-TW: 透過本地 Wi-Fi 在 Apple 裝置間直接聊天、群組聊天、對講、語音與傳檔。支援回覆、收回、@提及與搜尋；可設定檔案大小上限。無雲端、無帳號、無需連網。
    de: Chat, Gruppenchat, PTT, Sprachnachrichten und Dateien über lokales WLAN zwischen Apple-Geräten. Antworten, Zurückrufen,
      @Erwähnungen und Suche; konfigurierbare Dateigrößenlimits. Keine Cloud, kein Account, keine Internetverbindung nötig.
    fr: Chat, discussion de groupe, PTT, voix et fichiers via le Wi-Fi local entre appareils Apple. Réponse, rappel de message,
      @mentions et recherche ; limites de taille de fichier configurables. Pas de cloud, pas de compte, aucune connexion internet
      requise.
    ja: ローカルWi-Fi経由で、Apple製デバイス間のチャット、グループチャット、PTT、音声、ファイル送信ができます。返信、取り消し、@メンション、検索に対応し、ファイルサイズの上限も設定可能。クラウド不要、アカウント不要、インターネット接続も不要。
    ko: 로컬 Wi-Fi로 Apple 기기 간 채팅, 그룹 채팅, PTT, 음성, 파일을 주고받으세요. 답장, 회수, @멘션, 검색을 지원하며 파일 크기 제한도 설정할 수 있습니다. 클라우드 없음, 계정 불필요,
      인터넷 연결도 필요 없음.
    ru: Чат, групповой чат, PTT, голосовые сообщения и файлы по локальной сети Wi-Fi между устройствами Apple. Ответы, отзыв
      сообщений, @упоминания и поиск; настраиваемые ограничения размера файлов. Без облака, без аккаунта, подключение к интернету
      не требуется.
    th: แชต แชตกลุ่ม PTT ข้อความเสียง และไฟล์ผ่าน Wi-Fi ภายในเครือข่ายระหว่างอุปกรณ์ Apple ตอบกลับ ยกเลิกข้อความ @กล่าวถึง
      และค้นหา กำหนดขนาดไฟล์สูงสุดได้ ไม่ใช้คลาวด์ ไม่ต้องมีบัญชี ไม่ต้องเชื่อมต่ออินเทอร์เน็ต
    tr: Apple aygıtları arasında yerel Wi-Fi üzerinden sohbet, grup sohbeti, PTT, ses ve dosya aktarımı. Yanıtlama, geri çağırma,
      @bahsetmeler ve arama; yapılandırılabilir dosya boyutu sınırları. Bulut yok, hesap yok, internet gerekmez.
