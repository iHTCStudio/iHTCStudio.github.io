    tr: PiP ile çift kameralı kayıt — gerçek hayattaki kesintilere göre tasarlandı.
  blurbs:
    en: Record front & back cameras on iPhone and compatible iPads; on-device PiP, save to Photos. Export queue, Live Activity,
      recoverable interruptions, emergency background save, in-app guides & trilingual UI — privacy-first, no cloud, no account.
    zh-CN: 在 iPhone 与兼容 iPad 上前后双摄同录、本地 PiP 合成并保存相册；导出队列、Live Activity、可恢复中断、后台紧急保存、应用内教程与三语——隐私优先，无需云端、无需账号。
    zh-TW: 在 iPhone 與相容 iPad 上前後雙攝同錄、本機 PiP 合成並儲存相簿；匯出佇列、Live Activity、可恢復中斷、背景緊急保存、應用內教學與三語——隱私優先，無需雲端、無需帳號。
    de: Front- und Rückkamera gleichzeitig aufnehmen auf iPhone und kompatiblen iPads; PiP auf dem Gerät, Speichern in Fotos.
      Export-Warteschlange, Live Activity, wiederherstellbare Unterbrechungen, Notfall-Speichern im Hintergrund, Anleitungen
      in der App und dreisprachige Oberfläche — Datenschutz zuerst, keine Cloud, ohne Account.
    fr: Filmez avec les caméras avant et arrière sur iPhone et iPad compatibles ; PiP sur l’appareil, enregistrement dans
      Photos. File d’export, Live Activity, interruptions récupérables, sauvegarde d’urgence en arrière-plan, guides intégrés
      et interface trilingue — confidentialité d’abord, sans cloud ni compte.
    ja: iPhone と対応 iPad でフロント/バックカメラを同時録画。端末内で PiP 合成、写真に保存。書き出しキュー、Live Activity、復帰可能な中断、緊急バックグラウンド保存、アプリ内ガイド、3言語 UI — プライバシー最優先、クラウドなし、アカウント不要。
    ko: iPhone과 호환 iPad에서 전면·후면 카메라를 동시에 녹화합니다. 온디바이스 PiP 합성, 사진 앱에 저장. 내보내기 대기열, Live Activity, 복구 가능한 중단, 긴급 백그라운드 저장, 앱
      내 가이드, 3개 언어 UI — 개인정보 보호 우선, 클라우드 없음, 계정 불필요.
    ru: Запись на фронтальную и основную камеры iPhone и совместимых iPad; PiP на устройстве, сохранение в «Фото». Очередь
      экспорта, Live Activity, восстановление после прерываний, экстренное сохранение в фоне, встроенные руководства и интерфейс
      на трёх языках — приватность прежде всего, без облака и аккаунта.
    th: บันทึกวิดีโอด้วยกล้องหน้าและกล้องหลังพร้อมกันบน iPhone และ iPad ที่รองรับ รวม PiP บนเครื่อง บันทึกลงรูปภาพ มีคิวส่งออก
      Live Activity กู้คืนได้เมื่อถูกขัดจังหวะ บันทึกฉุกเฉินเบื้องหลัง คู่มือในแอป และ UI สามภาษา — ให้ความสำคัญกับความเป็นส่วนตัว
      ไม่มีคลาวด์ ไม่ต้องมีบัญชี
    tr: iPhone ve uyumlu iPad’lerde ön ve arka kamerayla kayıt yapın; cihazda PiP, Fotoğraflar’a kaydetme. Dışa aktarma kuyruğu,
      Live Activity, kurtarılabilir kesintiler, acil arka plan kaydı, uygulama içi rehberler ve üç dilli arayüz — önce gizlilik,
      bulut yok, hesap yok.
