    de: 'Immersives Surfen auf iPhone & iPad: Schwebekugel, Widgets für Home- und Sperrbildschirm, Siri & Kurzbefehle, optionales
      iCloud für Lesezeichen — die Kindersperre hält die Seite fest. Keine Werbung, keine Pop-ups.'
    fr: 'Navigation immersive sur iPhone et iPad : bulle flottante, widgets écran d''accueil/verrouillé, Siri et Raccourcis,
      iCloud optionnel pour les favoris — le verrou enfant fixe la page. Sans publicité, sans pop-up.'
    ja: iPhone・iPadで没入ブラウジング：フロートボール、ホーム/ロック画面ウィジェット、SiriとShortcuts、ブックマーク用の任意のiCloud。子供ロックでページを固定。広告なし、ポップアップなし。
    ko: 'iPhone·iPad에서 몰입형 브라우징: 플로트 볼, 홈/잠금 화면 위젯, Siri와 단축어, 북마크용 선택적 iCloud. 자녀 잠금으로 페이지를 고정합니다. 광고 없음, 팝업 없음.'
    ru: 'Погружение в просмотр на iPhone и iPad: плавающий шар, виджеты экрана «Домой» и блокировки, Siri и «Команды», необязательный
      iCloud для закладок. Детский замок фиксирует страницу. Без рекламы и всплывающих окон.'
    th: 'เรียกดูเว็บแบบดื่มด่ำบน iPhone และ iPad: ลูกบอลลอย วิดเจ็ตหน้าจอโฮม/ล็อก Siri และคำสั่งลัด iCloud เสริมสำหรับบุ๊กมาร์ก
