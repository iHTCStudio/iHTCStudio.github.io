    tr: 'iPhone ve iPad''de sürükleyici gezinme: yüzen top, Ana/Kilit ekranı widget''ları, Siri ve Kestirmeler, yer imleri
      için isteğe bağlı iCloud — çocuk kilidi sayfayı sabit tutar. Reklam yok, açılır pencere yok.'
