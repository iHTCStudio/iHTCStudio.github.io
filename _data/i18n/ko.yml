  stat_privacy_desc: 분석 SDK 없음, 광고 네트워크 없음, 강제 계정 없음. 사용 데이터를 수집하지 않습니다. 선택적 iCloud 동기화는 Apple 인프라만 사용합니다.
apps_section:
  eyebrow: 우리의 앱
  title: 세심하게, 디테일까지
  subtitle: 모든 앱은 Apple 기기에서 네이티브하게 느껴지도록 설계되었으며, 완전 오프라인으로 동작하고 프라이버시를 존중합니다. 자세히 볼 앱을 선택하세요.
  learn_more: 자세히 보기
  coming_soon: 곧 출시
  expand_hint: 기본은 간략 표시—카드를 열어 하이라이트를 보거나 모두 펼칠 수 있습니다.
  expand_all: 모두 펼치기
