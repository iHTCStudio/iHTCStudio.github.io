values:
  eyebrow: 우리가 믿는 것
  title: 조용히, 그러나 확실히 자리 잡는 앱
  items:
  - title: 기본값은 프라이버시
    desc: 계정 없음, 분석 없음, 제3자 SDK 없음. 데이터는 항상 기기에만 남습니다.
  - title: 네이티브하고 빠름
    desc: iOS, iPadOS, macOS용 SwiftUI. 즉시 실행과 배터리 친화적 성능.
  - title: 오프라인 우선
    desc: 핵심 기능은 인터넷 없이 동작합니다. 어디서든 도구가 따라와야 합니다.
  - title: 디테일한 설계
    desc: 세심한 타이포그래피, 햅틱, 유려한 모션, 완전한 다크 모드.
  - title: 다국어 사이트
    desc: 웹사이트 10개 언어—언제든 전환. 앱 UI는 각 App Store 페이지를 따릅니다.
  - title: 항상 광고 없음
    desc: 팝업 없음, 광고 네트워크 없음, 다크 패턴 없음.
