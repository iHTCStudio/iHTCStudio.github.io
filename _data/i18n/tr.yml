  stat_apps_title_suffix: özenle hazırlanmış uygulama
  stat_apps_desc: Pomodoro zamanlayıcılarından App Store gezintisine — her uygulama iPhone, iPad ve Mac için yerel SwiftUI
    ile geliştirilmiştir ve kendi destek sayfası, SSS bölümü ve gizlilik politikasına sahiptir.
  stat_apps_action: Tüm uygulamalara göz at ↓
  stat_offline_title: Temel özellikler %100 çevrimdışı
  stat_offline_desc: Soru bankaları, sözlükler, zamanlayıcılar ve hesap makineleri tamamen cihazınızda çalışır. Günlük kullanım
    için Wi‑Fi veya hücresel veri gerekmez — araçlarınız her yerde sizinle.
  stat_privacy_title: Sıfır izleme, sıfır reklam
  stat_privacy_desc: Analiz SDK'sı yok, reklam ağı yok, zorunlu hesap yok. Kullanım verilerinizi asla toplamayız. İsteğe bağlı
    iCloud eşzamanlaması yalnızca Apple altyapısını kullanır.
apps_section:
  eyebrow: Uygulamalarımız
  title: Özenle yapıldı, ayrıntılarla cilalandı
  subtitle: Her uygulama Apple cihazlarda yerel hissettirecek, tamamen çevrimdışı çalışacak ve gizliliğinize saygı duyacak
    şekilde tasarlandı. Daha fazla bilgi için birini seçin.
  learn_more: Daha fazla bilgi
