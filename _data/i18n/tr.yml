hero:
  eyebrow: iHTC Studio
  title: Özenle yapılmış uygulamalar. Sakin yazılımlar.
  subtitle: iHTC Studio, iPhone, iPad ve Mac için gizliliği ön planda tutan uygulamalar tasarlar. Hesap yok, izleme yok, bulut
