values:
  eyebrow: İnandıklarımız
  title: Yerini hak eden sessiz uygulamalar
  items:
  - title: Varsayılan olarak gizlilik
    desc: Hesap yok, analiz yok, üçüncü taraf SDK yok. Verileriniz her zaman cihazınızda kalır.
  - title: Yerel ve hızlı
    desc: iOS, iPadOS ve macOS için SwiftUI ile geliştirildi. Anında açılış ve pil dostu performans için ayarlandı.
  - title: Önce çevrimdışı
    desc: Tüm temel özellikler internet bağlantısı olmadan çalışır. Araçlarınız siz nereye giderseniz orada çalışmalı.
  - title: Ayrıntılarda tasarım
    desc: Özenli tipografi, gerçek dokunsal geri bildirim, akıcı hareket ve tam Karanlık Mod. Her ekranda piksel işçiliği.
  - title: Çok dilli site
    desc: Web sitesinde on dil — istediğiniz zaman geçiş yapın. Uygulama içi arayüz, her uygulamanın App Store sayfasını izler.
  - title: Her zaman reklamsız
    desc: Açılır pencere yok, reklam ağı yok, karanlık desen yok. Gösterim değil, güven kazanırız.
