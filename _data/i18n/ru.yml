hero:
  eyebrow: iHTC Studio
  title: Продуманные приложения. Спокойный софт.
  subtitle: iHTC Studio создаёт приложения для iPhone, iPad и Mac, в которых конфиденциальность — на первом месте. Без аккаунтов,
    без слежки, без облака — только продуманные инструменты, которые ценят ваше время.
  cta_explore: Смотреть приложения
  cta_contact: Связаться с нами
  stat_apps: Приложения
  stat_offline: Офлайн в приоритете
  stat_privacy: Без слежки
  stat_hint: Подробнее
  stat_tablist: Главное о студии
  stat_apps_title_suffix: тщательно разработанных приложений
  stat_apps_desc: От таймеров Pomodoro до просмотра App Store — каждое приложение нативное, на SwiftUI, для iPhone, iPad и
    Mac, со своей страницей поддержки, FAQ и политикой конфиденциальности.
  stat_apps_action: Все приложения ↓
  stat_offline_title: Основные функции на 100 % офлайн
  stat_offline_desc: Банки задач, словари, таймеры и калькуляторы работают полностью на вашем устройстве. Для повседневного
    использования не нужны ни Wi‑Fi, ни мобильная сеть — ваши инструменты всегда с вами.
  stat_privacy_title: Ни слежки, ни рекламы
  stat_privacy_desc: Никаких аналитических SDK, рекламных сетей и обязательных аккаунтов. Мы никогда не собираем данные об
    использовании. Необязательная синхронизация через iCloud использует только инфраструктуру Apple.
apps_section:
  eyebrow: Наши приложения
  title: Сделано с заботой, отточено до мелочей
  subtitle: Каждое приложение создано так, чтобы выглядеть нативно на устройствах Apple, полностью работать офлайн и уважать
    вашу конфиденциальность. Выберите приложение, чтобы узнать больше.
  learn_more: Подробнее
  coming_soon: Скоро
  expand_hint: По умолчанию в компактном виде — откройте карточку, чтобы увидеть главное, или разверните все.
  expand_all: Развернуть все
  collapse_all: Свернуть все
  show_details: Показать подробности
  hide_details: Скрыть подробности
  list_density_aria: Плотность списка приложений
values:
  eyebrow: Во что мы верим
  title: Тихие приложения, которые заслуживают своё место
  items:
  - title: Конфиденциальность по умолчанию
    desc: Без аккаунтов, без аналитики, без сторонних SDK. Ваши данные остаются на вашем устройстве — всегда.
  - title: Нативность и скорость
    desc: Создано на SwiftUI для iOS, iPadOS и macOS. Мгновенный запуск и бережное отношение к батарее.
  - title: Офлайн в приоритете
    desc: Все основные функции работают без подключения к интернету. Ваши инструменты должны работать везде, где вы находитесь.
  - title: Продумано до деталей
    desc: Выверенная типографика, настоящий тактильный отклик, плавная анимация и полноценный тёмный режим. Мастерство в каждом
      пикселе.
  - title: Многоязычный сайт
    desc: Десять языков на сайте — переключайтесь в любой момент. Интерфейс приложений соответствует странице в App Store.
  - title: Всегда без рекламы
    desc: Никаких всплывающих окон, рекламных сетей и тёмных паттернов. Мы зарабатываем доверие, а не показы.
