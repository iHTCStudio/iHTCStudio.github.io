  stat_offline: ออฟไลน์เป็นหลัก
  stat_privacy: ไม่มีการติดตาม
  stat_hint: ดูเพิ่มเติม
  stat_tablist: จุดเด่นของสตูดิโอ
  stat_apps_title_suffix: แอปที่สร้างอย่างพิถีพิถัน
  stat_apps_desc: ตั้งแต่ตัวจับเวลา Pomodoro ไปจนถึงการเรียกดู App Store — ทุกแอปเป็นเนทีฟด้วย SwiftUI สำหรับ iPhone, iPad
    และ Mac พร้อมหน้าสนับสนุน คำถามที่พบบ่อย และนโยบายความเป็นส่วนตัวของตัวเอง
  stat_apps_action: ดูแอปทั้งหมด ↓
  stat_offline_title: ฟีเจอร์หลักทำงานออฟไลน์ 100%
  stat_offline_desc: คลังโจทย์ พจนานุกรม ตัวจับเวลา และเครื่องคิดเลขทำงานบนอุปกรณ์ของคุณทั้งหมด ไม่ต้องใช้ Wi‑Fi หรือเครือข่ายมือถือสำหรับการใช้งานประจำวัน
    — เครื่องมือของคุณไปกับคุณทุกที่
  stat_privacy_title: ไม่ติดตาม ไม่มีโฆษณา
  stat_privacy_desc: ไม่มี SDK วิเคราะห์ข้อมูล ไม่มีเครือข่ายโฆษณา ไม่บังคับให้มีบัญชี เราไม่เก็บข้อมูลการใช้งานของคุณเลย
    การซิงก์ iCloud แบบเลือกได้ใช้โครงสร้างพื้นฐานของ Apple เท่านั้น
apps_section:
  eyebrow: แอปของเรา
  title: ใส่ใจในทุกรายละเอียด
  subtitle: ทุกแอปออกแบบให้ให้ความรู้สึกเป็นเนทีฟบนอุปกรณ์ Apple ทำงานออฟไลน์ได้เต็มรูปแบบ และเคารพความเป็นส่วนตัวของคุณ เลือกแอปที่สนใจเพื่อดูรายละเอียด
  learn_more: ดูเพิ่มเติม
  coming_soon: เร็ว ๆ นี้
