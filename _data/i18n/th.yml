values:
  eyebrow: สิ่งที่เรายึดมั่น
  title: แอปเงียบ ๆ ที่คู่ควรกับพื้นที่บนอุปกรณ์ของคุณ
  items:
  - title: ความเป็นส่วนตัวเป็นค่าเริ่มต้น
    desc: ไม่มีบัญชี ไม่มีการวิเคราะห์ข้อมูล ไม่มี SDK จากบุคคลที่สาม ข้อมูลของคุณอยู่บนอุปกรณ์ของคุณเสมอ
  - title: เนทีฟและรวดเร็ว
    desc: สร้างด้วย SwiftUI สำหรับ iOS, iPadOS และ macOS ปรับแต่งให้เปิดได้ทันทีและประหยัดแบตเตอรี่
  - title: ออฟไลน์เป็นหลัก
    desc: ฟีเจอร์หลักทุกอย่างใช้งานได้โดยไม่ต้องเชื่อมต่ออินเทอร์เน็ต เครื่องมือของคุณควรใช้งานได้ทุกที่ที่คุณอยู่
  - title: ออกแบบอย่างละเอียด
    desc: ตัวอักษรที่คัดสรรมาอย่างดี การตอบสนองแบบสัมผัสจริง แอนิเมชันลื่นไหล และโหมดมืดเต็มรูปแบบ ประณีตในทุกพิกเซลของทุกหน้าจอ
  - title: เว็บไซต์หลายภาษา
    desc: เว็บไซต์รองรับ 10 ภาษา — สลับได้ทุกเมื่อ ส่วนอินเทอร์เฟซในแอปเป็นไปตามหน้า App Store ของแต่ละแอป
  - title: ปลอดโฆษณาตลอดไป
    desc: ไม่มีป๊อปอัป ไม่มีเครือข่ายโฆษณา ไม่มี dark pattern เราต้องการความไว้วางใจ ไม่ใช่ยอดการแสดงผล
