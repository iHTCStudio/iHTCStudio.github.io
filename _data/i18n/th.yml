hero:
  eyebrow: iHTC Studio
  title: แอปที่ประณีต ซอฟต์แวร์ที่สงบ
  subtitle: iHTC Studio ออกแบบแอปที่ให้ความสำคัญกับความเป็นส่วนตัวสำหรับ iPhone, iPad และ Mac ไม่มีบัญชี ไม่มีการติดตาม ไม่มีคลาวด์
    — มีเพียงเครื่องมือที่คิดมาอย่างดีและเคารพเวลาของคุณ
  cta_explore: ดูแอปทั้งหมด
  cta_contact: ติดต่อเรา
