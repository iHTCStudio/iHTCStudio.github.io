    kein WLAN oder Mobilfunk.
  stat_privacy_title: Null Tracking, null Werbung
  stat_privacy_desc: Keine Analytics-SDKs, keine Werbenetze, keine Pflichtkonten. Wir erfassen keine Nutzungsdaten. Optionale
    iCloud-Sync nutzt nur Apples Infrastruktur.
