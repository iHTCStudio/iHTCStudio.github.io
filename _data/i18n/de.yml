values:
  eyebrow: Was uns wichtig ist
  title: Leise Apps, die ihren Platz verdienen
  items:
  - title: Datenschutz standardmäßig
    desc: Keine Konten, keine Analysen, keine Drittanbieter-SDKs. Ihre Daten bleiben immer auf dem Gerät.
  - title: Nativ und schnell
    desc: Mit SwiftUI für iOS, iPadOS und macOS. Schneller Start und sparsam mit der Batterie.
  - title: Offline zuerst
    desc: Alle Kernfunktionen ohne Internet. Ihre Tools sollten überall funktionieren.
  - title: Liebe zum Detail
    desc: Typografie, Haptik, flüssige Animationen, vollständiger Dark Mode.
  - title: Mehrsprachige Website
    desc: Zehn Sprachen auf der Website — jederzeit wechseln. App-UI folgt der jeweiligen App-Store-Seite.
  - title: Immer werbefrei
    desc: Keine Pop-ups, keine Werbenetze, keine Dark Patterns.
