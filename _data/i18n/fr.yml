  stat_apps: Apps
  stat_offline: Hors ligne d’abord
  stat_privacy: Aucun suivi
  stat_hint: En savoir plus
  stat_tablist: Points forts du studio
  stat_apps_title_suffix: apps conçues avec soin
  stat_apps_desc: Des minuteurs Pomodoro à la navigation sur l’App Store — chaque app est native en SwiftUI pour iPhone, iPad
    et Mac, avec sa propre page d’assistance, sa FAQ et sa politique de confidentialité.
  stat_apps_action: Parcourir toutes les apps ↓
  stat_offline_title: Fonctions essentielles 100 % hors ligne
  stat_offline_desc: Banques de questions, dictionnaires, minuteurs et calculatrices fonctionnent entièrement sur votre appareil.
    Pas besoin de Wi‑Fi ni de réseau cellulaire au quotidien — vos outils vous suivent partout.
  stat_privacy_title: Zéro suivi, zéro publicité
  stat_privacy_desc: Aucun SDK d’analyse, aucun réseau publicitaire, aucun compte obligatoire. Nous ne collectons jamais vos
    données d’utilisation. La synchronisation iCloud facultative n’utilise que l’infrastructure d’Apple.
apps_section:
  eyebrow: Nos apps
  title: Conçues avec soin, peaufinées dans les détails
  subtitle: Chaque app est pensée pour s’intégrer naturellement aux appareils Apple, fonctionner entièrement hors ligne et
    respecter votre vie privée. Choisissez-en une pour en savoir plus.
  learn_more: En savoir plus
  coming_soon: Bientôt disponible
  expand_hint: Affichage compact par défaut — ouvrez une carte pour voir les points forts, ou tout développer.
  expand_all: Tout développer
  collapse_all: Tout réduire
  show_details: Afficher les détails
  hide_details: Masquer les détails
  list_density_aria: Densité de la liste d’apps
values:
  eyebrow: Ce en quoi nous croyons
  title: Des apps discrètes qui méritent leur place
  items:
  - title: Confidentialité par défaut
    desc: Pas de compte, pas d’analyse, pas de SDK tiers. Vos données restent sur votre appareil — toujours.
  - title: Natif et rapide
    desc: Conçu avec SwiftUI pour iOS, iPadOS et macOS. Optimisé pour un lancement instantané et une faible consommation de
      batterie.
  - title: Hors ligne d’abord
    desc: Chaque fonction essentielle marche sans connexion Internet. Vos outils doivent fonctionner partout où vous allez.
  - title: Pensé dans les moindres détails
    desc: Typographie soignée, véritable retour haptique, animations fluides et mode sombre complet. Un travail d’orfèvre
      sur chaque écran.
  - title: Site multilingue
    desc: Dix langues sur le site web — changez à tout moment. L’interface des apps suit la fiche App Store de chacune.
  - title: Sans publicité, toujours
    desc: Pas de fenêtres intrusives, pas de réseaux publicitaires, pas de dark patterns. Nous gagnons votre confiance, pas
      des impressions.
