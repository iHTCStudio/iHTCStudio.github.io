hero:
  eyebrow: iHTC Studio
  title: Crafted apps. Calm software.
  subtitle: iHTC Studio designs privacy-first apps for iPhone, iPad and Mac. No accounts, no tracking, no cloud — just thoughtful
    tools that respect your time.
  cta_explore: Explore apps
  cta_contact: Get in touch
  stat_apps: Apps
  stat_offline: Offline-first
  stat_privacy: No tracking
  stat_hint: Learn more
  stat_tablist: Studio highlights
  stat_apps_title_suffix: thoughtfully crafted apps
  stat_apps_desc: From Pomodoro timers to App Store browsing — each app is native SwiftUI for iPhone, iPad, and Mac, with
    its own support page, FAQ, and privacy policy.
  stat_apps_action: Browse all apps ↓
  stat_offline_title: 100% offline-first core features
  stat_offline_desc: Problem banks, dictionaries, timers, and calculators run entirely on your device. No Wi-Fi or cellular
    needed for everyday use — your tools travel with you.
  stat_privacy_title: Zero tracking, zero ads
  stat_privacy_desc: No analytics SDKs, no ad networks, no mandatory accounts. We never collect your usage data. Optional
    iCloud sync uses Apple's infrastructure only.
apps_section:
  eyebrow: Our apps
