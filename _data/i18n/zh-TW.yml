values:
  eyebrow: 我們的理念
  title: 安靜地把每件小事做對
  items:
  - title: 預設隱私
    desc: 不要帳號、不收集資料、不接入任何第三方 SDK。所有內容都只留在你的裝置上。
  - title: 原生快速
    desc: 基於 SwiftUI 為 iOS、iPadOS 和 macOS 構建,啟動迅捷、節能省電。
  - title: 離線優先
    desc: 所有核心功能均可在無網路環境下使用,讓你的工具陪你去任何地方。
  - title: 細節為王
    desc: 考究的排版、真實的觸感、流暢的動效、完整的深色模式。每個像素都精心雕琢。
  - title: 多語言網站
    desc: 官網支援十種語言，隨時切換；App 內介面以 App Store 產品頁說明為準。
  - title: 永久無廣告
    desc: 無彈窗、無廣告聯盟、無套路設計。我們贏得信任，而非曝光量。
