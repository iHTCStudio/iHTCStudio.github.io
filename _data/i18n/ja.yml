  stat_apps_title_suffix: 丁寧に作られたアプリ
  stat_apps_desc: ポモドーロから App Store ブラウジングまで——各アプリは iPhone、iPad、Mac 向け SwiftUI ネイティブで、独自のサポートページ、FAQ、プライバシーポリシー付きです。
  stat_apps_action: すべてのアプリ ↓
  stat_offline_title: コア機能は 100% オフライン
  stat_offline_desc: 問題集、辞書、タイマー、計算機などは端末内だけで動作。日常使いに Wi‑Fi や cellular は不要——ツールはあなたと一緒に移動します。
  stat_privacy_title: 追跡ゼロ、広告ゼロ
  stat_privacy_desc: 分析 SDK なし、広告ネットワークなし、強制アカウントなし。利用データは収集しません。任意の iCloud 同期は Apple の基盤のみを使用します。
