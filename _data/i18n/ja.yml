values:
  eyebrow: 大切にしていること
  title: 静かに、しかし確かに寄り添うアプリ
  items:
  - title: デフォルトでプライバシー
    desc: アカウント不要、分析なし、第三者 SDK なし。データは常にあなたのデバイスに留まります。
  - title: ネイティブで高速
    desc: iOS、iPadOS、macOS 向け SwiftUI。即時起動と省電力を意識した調整。
  - title: オフライン優先
    desc: コア機能はインターネットなしで動作。どこへ行ってもツールが使えるべきです。
  - title: 細部まで設計
    desc: 配慮されたタイポグラフィ、触覚、滑らかなモーション、完全なダークモード。画面ごとに丁寧に仕上げています。
  - title: 多言語サイト
    desc: サイトは 10 言語対応——いつでも切り替え可能。アプリ内 UI は各 App Store 掲載情報に従います。
  - title: ずっと広告なし
    desc: ポップアップなし、広告ネットワークなし、ダークパターンなし。インプレッションではなく信頼を大切にします。
