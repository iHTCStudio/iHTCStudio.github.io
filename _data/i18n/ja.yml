  eyebrow: 私たちのアプリ
  title: 細部まで磨き込んだ設計
  subtitle: すべてのアプリは Apple デバイス上でネイティブに感じられるよう設計され、完全オフラインで動作し、プライバシーを尊重します。詳しく知りたいアプリを選んでください。
  learn_more: 詳しく見る
